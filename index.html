<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STACKLY | Stock, Billing & Distribution Management Platform</title>
  
  <!-- Stackly Official Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M22 45 C18 30 26 16 42 8 C38 22 46 34 66 38 C48 44 28 52 22 45 Z' fill='%237FD1B9'/><path d='M42 46 C60 42 78 52 74 72 C68 86 50 94 34 90 C42 80 44 68 28 62 C34 56 38 50 42 46 Z' fill='%231E3A5F'/></svg>" />
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-body: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --border-color: #E2E8F0;
      --border-light: #F1F5F9;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      
      --brand-navy: #1E3A5F;
      --brand-teal: #7FD1B9;

      --primary: #2563EB;
      --primary-light: #EFF6FF;
      --primary-hover: #1D4ED8;
      --primary-focus: rgba(37, 99, 235, 0.2);

      --blue-500: #3B82F6;
      --blue-bg: #EFF6FF;
      --green-500: #10B981;
      --green-bg: #ECFDF5;
      --purple-500: #8B5CF6;
      --purple-bg: #F5F3FF;
      --yellow-500: #EAB308;
      --yellow-bg: #FEFCE8;
      --red-500: #EF4444;
      --red-bg: #FEF2F2;

      --sidebar-width: 260px;
      --sidebar-collapsed-width: 78px;
      --header-height: 70px;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
      --shadow-dropdown: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);

      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    body.sidebar-open,
    html.sidebar-open {
      overflow: hidden !important;
      touch-action: none;
    }

    /* ========================================================
       TOP GLOBAL LOADING BAR & SKELETON
       ======================================================== */
    .top-loading-bar-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 999;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }

    .top-loading-bar-indicator {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #7FD1B9, #2563EB, #8B5CF6);
      animation: topBarSlide 0.4s ease infinite;
      box-shadow: 0 0 10px #2563EB;
    }

    @keyframes topBarSlide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    /* Modern Skeleton Loader Container */
    .page-loader-skeleton-box {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      padding: 1rem 0;
      animation: fadeIn 0.2s ease;
    }

    .skeleton-hero-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      box-shadow: var(--shadow-card);
    }

    .modern-spinner-ring {
      width: 48px;
      height: 48px;
      border: 3.5px solid #E2E8F0;
      border-top-color: #2563EB;
      border-right-color: #7FD1B9;
      border-radius: 50%;
      animation: spinRing 0.6s linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .skeleton-pulse-bar {
      height: 14px;
      border-radius: var(--radius-full);
      background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%);
      background-size: 200% 100%;
      animation: shimmerBar 1.2s infinite;
    }

    @keyframes shimmerBar {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ========================================================
       404 NOT FOUND / UNDER CONSTRUCTION PAGE
       ======================================================== */
    .not-found-wrapper-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 4rem 2rem;
      text-align: center;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .not-found-wrapper-card::before {
      content: '';
      position: absolute;
      top: -120px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(127, 209, 185, 0.15), rgba(37, 99, 235, 0.05), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .badge-404-hero {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #1E3A5F 0%, #2563EB 50%, #7FD1B9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 10px 20px rgba(37, 99, 235, 0.1));
    }

    .not-found-title-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 0.75rem;
    }

    .not-found-subtext {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .not-found-actions-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* ========================================================
       LOGIN SCREEN STYLES
       ======================================================== */
    .login-viewport {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 50%, #F0F4FF 100%);
      padding: 1.5rem;
    }

    .login-card-box {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 40px -10px rgba(30, 58, 95, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: loginPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-brand-display {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .login-form-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .login-field-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      width: 100%;
    }

    .login-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
    }

    .login-input-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: var(--radius-md);
      transition: all 0.15s ease;
    }

    .login-input-container:focus-within {
      background: #FFFFFF;
      border-color: #2563EB;
      box-shadow: 0 0 0 3.5px var(--primary-focus);
    }

    .login-input-icon-left {
      padding-left: 1rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-text-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 0.75rem;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: #0F172A;
    }

    .login-password-eye-btn {
      background: none;
      border: none;
      padding-right: 1rem;
      color: #94A3B8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .login-password-eye-btn:hover {
      color: #475569;
    }

    .login-submit-btn {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.5rem;
      border-radius: var(--radius-md);
      background: #2563EB;
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--font-sans);
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-submit-btn:hover {
      background: #1D4ED8;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .login-submit-btn:active {
      transform: translateY(0);
    }

    .login-demo-hint {
      margin-top: 1.25rem;
      padding: 0.65rem 0.85rem;
      background: #EFF6FF;
      border: 1px dashed #BFDBFE;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      color: #1E40AF;
      text-align: center;
      width: 100%;
    }

    /* ========================================================
       DASHBOARD & APP STYLES
       ======================================================== */
    .app-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
      position: relative;
    }

    .mobile-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
      touch-action: none;
    }
    .mobile-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      transition: width var(--transition-normal), transform var(--transition-normal);
      overscroll-behavior: contain;
      user-select: none;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .sidebar-logo-section {
      height: var(--header-height);
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid var(--border-light);
      overflow: hidden;
    }

    .sidebar.collapsed .sidebar-logo-section {
      justify-content: center;
      padding: 0;
    }

    .nav-menu-scroll {
      flex: 1;
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
    }

    .nav-link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: var(--radius-md);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      white-space: nowrap;
      position: relative;
    }

    .nav-link-btn:hover {
      background: #F1F5F9;
      color: var(--text-main);
    }

    .nav-link-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .nav-link-btn.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 3.5px;
      border-radius: 0 4px 4px 0;
      background: var(--primary);
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-badge-pill {
      display: none;
    }

    .sidebar.collapsed .nav-link-btn {
      justify-content: center;
      padding: 0.75rem;
    }

    .nav-badge-pill {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      background: #F1F5F9;
      color: var(--text-muted);
      font-weight: 600;
    }

    .billing-quick-btn {
      margin: 0.75rem 0.25rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      background: #0F172A;
      color: #FFFFFF;
      border: 1px solid #0F172A;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
      white-space: nowrap;
    }

    .billing-quick-btn:hover {
      background: #1E293B;
      transform: translateY(-1px);
    }

    .sidebar.collapsed .billing-quick-btn span {
      display: none;
    }

    .sidebar-footer-widget {
      padding: 1rem 0.85rem;
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .sidebar.collapsed .sidebar-footer-widget {
      justify-content: center;
      padding: 0.85rem 0.25rem;
    }

    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left var(--transition-normal);
    }

    .app-layout.sidebar-collapsed .main-wrapper {
      margin-left: var(--sidebar-collapsed-width);
    }

    .topbar {
      height: var(--header-height);
      position: sticky;
      top: 0;
      z-index: 40;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      box-shadow: var(--shadow-sm);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .icon-toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-toggle-btn:hover {
      background: #F1F5F9;
      color: var(--text-main);
    }

    #mobile-hamburger-btn {
      display: none;
    }

    .breadcrumb-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .topbar-search-box {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-full);
      width: 260px;
      transition: all 0.15s ease;
    }

    .topbar-search-box:focus-within {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-focus);
      width: 300px;
    }

    .topbar-search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      width: 100%;
      color: var(--text-main);
    }

    .notif-wrapper {
      position: relative;
    }

    .notif-bell-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .notif-bell-btn:hover {
      background: #F8FAFC;
      color: var(--text-main);
    }

    .notif-dot-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      background: var(--red-500);
      border-radius: var(--radius-full);
      border: 2px solid #FFFFFF;
    }

    .dropdown-box {
      position: absolute;
      top: 48px;
      right: 0;
      width: 320px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-dropdown);
      z-index: 60;
      overflow: hidden;
      animation: dropdownPop 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dropdown-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .dropdown-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .dropdown-item:hover {
      background: #F8FAFC;
    }

    .profile-pill-box {
      position: relative;
    }

    .profile-pill-btn {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.35rem 0.75rem 0.35rem 0.4rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .profile-pill-btn:hover {
      background: #F8FAFC;
      border-color: #CBD5E1;
    }

    .profile-avatar-img {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #1E3A5F, #2563EB);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .online-indicator-dot {
      position: absolute;
      bottom: 0px;
      right: 0px;
      width: 9px;
      height: 9px;
      border-radius: var(--radius-full);
      background: var(--green-500);
      border: 2px solid #FFFFFF;
    }

    .profile-meta-text {
      text-align: left;
      line-height: 1.2;
    }

    .profile-meta-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0F172A;
    }

    .profile-meta-role {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Main Area & Metrics */
    .main-content-area {
      padding: 2rem;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      transition: opacity 0.2s ease;
    }

    .metrics-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.4rem;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 120px;
    }

    .metric-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .metric-title-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .metric-icon-bubble {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bubble-blue { background: var(--blue-bg); color: var(--blue-500); }
    .bubble-green { background: var(--green-bg); color: var(--green-500); }
    .bubble-purple { background: var(--purple-bg); color: var(--purple-500); }
    .bubble-yellow { background: var(--yellow-bg); color: var(--yellow-500); }

                          <div className="metric-top-row">
                            <span className="metric-title-label">Today's Collected Amount</span>
                            <div className="metric-icon-bubble bubble-purple">
                              <AppIcon name="dollar" size={18} />
                            </div>
                          </div>
                          <div className="metric-value-num" style={{ color: '#0F172A' }}>
                            {fmt(netTodayCollection)}
                          </div>

                          <div className="breakdown-grid-list">
                            <div className="breakdown-row">
                              <span>Bill Save (Cash):</span>
                              <span className="val-green">{fmt(totalCashCollected)}</span>
                            </div>
                            <div className="breakdown-row">
                              <span>GPay:</span>
                              <span className="val-blue">{fmt(totalGPayCollected)}</span>
                            </div>
                            <div className="breakdown-row">
                              <span>Old Pending Collected:</span>
                              <span className="val-orange">{fmt(totalOldPendingCollected)}</span>
                            </div>
                            <div className="breakdown-row">
                              <span>CNG/Petrol:</span>
                              <span className="val-red">-{fmt(expenses.cngPetrol)}</span>
                            </div>
                            <div className="breakdown-row">
                              <span>Makroon:</span>
                              <span className="val-red">-{fmt(expenses.makroonDaily)}</span>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Table with Tabs */}
                      <div className="table-section-card">
                        <div className="table-section-head">
                          <div>
                            <h2 className="table-main-title">
                              {activeTableTab === 'payments' && "Today's Received Payments"}
                              {activeTableTab === 'returns' && "Return Packets Audit"}
                              {activeTableTab === 'pending' && "Today Pending Given Shop"}
                              {activeTableTab === 'gst' && "GST Billing Register"}
                            </h2>

                            <div className="badges-pill-container">
                              <span className="pill-badge pill-green">
                                Total Collected Today: {fmt(netTodayCollection)}
                              </span>
                              <span className="pill-badge pill-gray">
                                Bill Save (Cash): {fmt(totalCashCollected)}
                              </span>
                              <span className="pill-badge pill-blue">
                                GPay: {fmt(totalGPayCollected)}
                              </span>
                              <span className="pill-badge pill-orange">
                                Old Pending Collected: {fmt(totalOldPendingCollected)}
                              </span>
                              <span className="pill-badge pill-red">
                                CNG/Petrol: -{fmt(expenses.cngPetrol)}
                              </span>
                              <span className="pill-badge pill-red">
                                Makroon: -{fmt(expenses.makroonDaily)}
                              </span>
                            </div>
                          </div>

                          <div className="tab-switch-group">
                            <button
                              className={`tab-switch-btn ${activeTableTab === 'payments' ? 'active' : ''}`}
                              onClick={() => setActiveTableTab('payments')}
                            >
                              <span>Payments Received</span>
                              <strong style={{ fontSize: '0.85rem' }}>({payments.length})</strong>
                            </button>

                            <button
                              className={`tab-switch-btn ${activeTableTab === 'returns' ? 'active' : ''}`}
                              onClick={() => setActiveTableTab('returns')}
                            >
                              <span>Return Packets</span>
                              <strong style={{ fontSize: '0.85rem' }}>({returnsList.length})</strong>
                            </button>

                            <button
                              className={`tab-switch-btn ${activeTableTab === 'pending' ? 'active' : ''}`}
                              onClick={() => setActiveTableTab('pending')}
                            >
                              <span>Today Pending Given Shop</span>
                              <strong style={{ fontSize: '0.85rem' }}>({pendingShops.length})</strong>
                            </button>

                            <button
                              className={`tab-switch-btn ${activeTableTab === 'gst' ? 'active' : ''}`}
                              onClick={() => setActiveTableTab('gst')}
                            >
                              <span>GST Bills</span>
                              <strong style={{ fontSize: '0.85rem' }}>({gstBills.length})</strong>
                            </button>
                          </div>
                        </div>

                        {activeTableTab === 'payments' && (
                          <div className="table-responsive-box">
                            <table className="custom-data-table">
                              <thead>
                                <tr>
                                  <th>SHOP NAME</th>
                                  <th>BILL ID</th>
                                  <th>PAYMENT TYPE</th>
                                  <th>PAID AMOUNT TODAY</th>
                                  <th>BILL PENDING BALANCE</th>
                                  <th>COLLECTED BY</th>
                                </tr>
                              </thead>
                              <tbody>
                                {payments.map(pay => (
                                  <tr key={pay.id}>
                                    <td style={{ fontWeight: 600 }}>{pay.shopName}</td>
                                    <td style={{ fontFamily: 'monospace', fontWeight: 600, color: 'var(--primary)' }}>
                                      {pay.billId}
                                    </td>
                                    <td>
                                      <span className={`pill-badge ${pay.paymentType === 'Cash' ? 'pill-green' : pay.paymentType === 'GPay' ? 'pill-blue' : 'pill-orange'}`}>
                                        {pay.paymentType}
                                      </span>
                                    </td>
                                    <td style={{ fontWeight: 700, color: '#16A34A' }}>
                                      {fmt(pay.paidAmount)}
                                    </td>
                                    <td style={{ fontWeight: 600, color: pay.pendingBalance > 0 ? '#DC2626' : '#64748B' }}>
                                      {fmt(pay.pendingBalance)}
                                    </td>
                                    <td style={{ color: 'var(--text-muted)' }}>{pay.collectedBy}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}

                        {activeTableTab === 'returns' && (
                          <div className="table-responsive-box">
                            <table className="custom-data-table">
                              <thead>
                                <tr>
                                  <th>RETURN ID</th>
                                  <th>SHOP NAME</th>
                                  <th>PRODUCT NAME</th>
                                  <th>RETURN PACKETS</th>
                                  <th>REASON</th>
                                  <th>DATE</th>
                                </tr>
                              </thead>
                              <tbody>
                                {returnsList.map(ret => (
                                  <tr key={ret.id}>
                                    <td style={{ fontFamily: 'monospace', fontWeight: 600 }}>{ret.id}</td>
                                    <td style={{ fontWeight: 600 }}>{ret.shopName}</td>
                                    <td>{ret.productName}</td>
                                    <td style={{ fontWeight: 700, color: '#DC2626' }}>{ret.packets} Pkts</td>
                                    <td>{ret.reason}</td>
                                    <td style={{ color: 'var(--text-muted)' }}>{ret.date}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}

                        {activeTableTab === 'pending' && (
                          <div className="table-responsive-box">
                            <table className="custom-data-table">
                              <thead>
                                <tr>
                                  <th>SHOP NAME</th>
                                  <th>BILL ID</th>
                                  <th>TOTAL BILL AMOUNT</th>
                                  <th>PAID TODAY</th>
                                  <th>PENDING BALANCE GIVEN</th>
                                </tr>
                              </thead>
                              <tbody>
                                {pendingShops.map((ps, idx) => (
                                  <tr key={idx}>
                                    <td style={{ fontWeight: 600 }}>{ps.shopName}</td>
                                    <td style={{ fontFamily: 'monospace', color: 'var(--primary)' }}>{ps.billId}</td>
                                    <td style={{ fontWeight: 600 }}>{fmt(ps.totalBill)}</td>
                                    <td style={{ color: '#16A34A', fontWeight: 600 }}>{fmt(ps.paidToday)}</td>
                                    <td style={{ color: '#DC2626', fontWeight: 700 }}>{fmt(ps.pendingNow)}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}

                        {activeTableTab === 'gst' && (
                          <div className="table-responsive-box">
                            <table className="custom-data-table">
                              <thead>
                                <tr>
                                  <th>GST BILL ID</th>
                                  <th>SHOP NAME</th>
                                  <th>GSTIN NUMBER</th>
                                  <th>TAXABLE VALUE</th>
                                  <th>GST (5%)</th>
                                  <th>GRAND TOTAL</th>
                                </tr>
                              </thead>
                              <tbody>
                                {gstBills.map(gb => (
                                  <tr key={gb.billId}>
                                    <td style={{ fontFamily: 'monospace', fontWeight: 700, color: 'var(--primary)' }}>{gb.billId}</td>
                                    <td style={{ fontWeight: 600 }}>{gb.shopName}</td>
                                    <td style={{ fontFamily: 'monospace', fontSize: '0.78rem' }}>{gb.gstNo}</td>
                                    <td>{fmt(gb.taxableValue)}</td>
                                    <td style={{ color: '#2563EB' }}>{fmt(gb.gstAmount)}</td>
                                    <td style={{ fontWeight: 700 }}>{fmt(gb.grandTotal)}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    </>
                  )}

                  {/* View: Shops */}
                  {currentNav === 'shops' && (
                    <div>
                      <div className="view-header-row">
                        <h2>Registered Shops & Retail Outlets</h2>
                        <button className="btn-action btn-action-primary" onClick={() => setNewShopModalOpen(true)}>
                          <AppIcon name="plus" size={16} /> <span>Add New Shop</span>
                        </button>
                      </div>
                      <div className="table-section-card">
                        <div className="table-responsive-box">
                          <table className="custom-data-table">
                            <thead>
                              <tr>
                                <th>SHOP NAME</th>
                                <th>OWNER NAME</th>
                                <th>AREA</th>
                                <th>PHONE</th>
                                <th>OUTSTANDING BALANCE</th>
                              </tr>
                            </thead>
                            <tbody>
                              {shops.map(s => (
                                <tr key={s.id}>
                                  <td style={{ fontWeight: 600 }}>{s.name}</td>
                                  <td>{s.owner}</td>
                                  <td>{s.area}</td>
                                  <td style={{ fontFamily: 'monospace' }}>{s.phone}</td>
                                  <td style={{ fontWeight: 700, color: s.balance > 0 ? '#DC2626' : '#16A34A' }}>
                                    {fmt(s.balance)}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* View: Products & Stock */}
                  {(currentNav === 'products' || currentNav === 'stock') && (
                    <div>
                      <div className="view-header-row">
                        <h2>Products & Inventory Status</h2>
                        <button className="btn-action btn-action-primary" onClick={() => setNewProductModalOpen(true)}>
                          <AppIcon name="plus" size={16} /> <span>Add New Product</span>
                        </button>
                      </div>
                      <div className="table-section-card">
                        <div className="table-responsive-box">
                          <table className="custom-data-table">
                            <thead>
                              <tr>
                                <th>PRODUCT NAME</th>
                                <th>CATEGORY</th>
                                <th>SELLING PRICE</th>
                                <th>COST</th>
                                <th>STOCK</th>
                                <th>ACTION</th>
                              </tr>
                            </thead>
                            <tbody>
                              {products.map(p => (
                                <tr key={p.id}>
                                  <td style={{ fontWeight: 600 }}>{p.name}</td>
                                  <td><span className="pill-badge pill-gray">{p.category}</span></td>
                                  <td style={{ fontWeight: 700 }}>{fmt(p.price)}</td>
                                  <td style={{ color: 'var(--text-muted)' }}>{fmt(p.cost)}</td>
                                  <td>
                                    <strong style={{ color: p.stock < 180 ? '#DC2626' : '#16A34A' }}>
                                      {p.stock} Pkts
                                    </strong>
                                  </td>
                                  <td>
                                    <button
                                      className="btn-action"
                                      style={{ padding: '0.25rem 0.5rem', fontSize: '0.75rem' }}
                                      onClick={() => {
                                        setProducts(products.map(item => item.id === p.id ? { ...item, stock: item.stock + 50 } : item));
                                        alert(`Restocked +50 pkts for ${p.name}`);
                                      }}
                                    >
                                      + Restock 50
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ULTRA-MODERN 404 / UNDER CONSTRUCTION PAGE FOR OTHER MENUS */}
                  {(currentNav === 'suppliers' || currentNav === 'purchases' || currentNav === 'reports') && (
                    <div className="not-found-wrapper-card">
                      <div className="badge-404-hero">404</div>
                      <h2 className="not-found-title-text">
                        {currentNav.charAt(0).toUpperCase() + currentNav.slice(1)} Module Under Construction
                      </h2>
                      <p className="not-found-subtext">
                        The <strong>{currentNav.charAt(0).toUpperCase() + currentNav.slice(1)}</strong> management section is currently being integrated into your Stackly ERP cloud environment. Core features will go live in the next update!
                      </p>
                      
                      <div className="not-found-actions-group">
                        <button
                          className="btn-action btn-action-primary"
                          onClick={() => handleNavigate('dashboard')}
                        >
                          <AppIcon name="home" size={16} color="#FFFFFF" />
                          <span>Return to Dashboard</span>
                        </button>
                        
                        <button
                          className="btn-action"
                          onClick={() => setBillingModalOpen(true)}
                        >
                          <AppIcon name="dollar" size={16} color="#2563EB" />
                          <span>Open POS Billing ($)</span>
                        </button>
                      </div>
                    </div>
                  )}
                </>
              )}
            </main>
          </div>

          {/* Quick Billing Modal */}
          {billingModalOpen && (
            <div className="modal-overlay-backdrop" onClick={() => setBillingModalOpen(false)}>
              <div className="modal-window-card" onClick={(e) => e.stopPropagation()}>
                <div className="modal-head-row">
                  <h2 style={{ fontSize: '1.15rem', fontWeight: 700 }}>Generate Fast Bill / Invoice</h2>
                  <button className="btn-action" style={{ padding: '0.2rem 0.5rem' }} onClick={() => setBillingModalOpen(false)}>✕</button>
                </div>
                <form onSubmit={handleCreateBill}>
                  <div className="modal-body-content">
                    <div className="form-grid-2">
                      <div className="form-group-col span-2">
                        <label>Select Shop / Customer *</label>
                        <select className="form-ctrl" value={billingShop} onChange={(e) => setBillingShop(e.target.value)}>
                          {shops.map(s => <option key={s.id} value={s.name}>{s.name} ({s.area})</option>)}
                        </select>
                      </div>
                      <div className="form-group-col">
                        <label>Product Item</label>
                        <select className="form-ctrl" value={billingItem} onChange={(e) => setBillingItem(e.target.value)}>
                          {products.map(p => <option key={p.id} value={p.id}>{p.name} ({fmt(p.price)})</option>)}
                        </select>
                      </div>
                      <div className="form-group-col">
                        <label>Quantity (Pkts)</label>
                        <input type="number" min="1" className="form-ctrl" value={billingQty} onChange={(e) => setBillingQty(Number(e.target.value))} />
                      </div>
                      <div className="form-group-col">
                        <label>Payment Mode</label>
                        <select className="form-ctrl" value={billingPaymentType} onChange={(e) => setBillingPaymentType(e.target.value)}>
                          <option value="Cash">Cash</option>
                          <option value="GPay">GPay / UPI</option>
                          <option value="Old Pending (Cash)">Old Pending (Cash)</option>
                          <option value="Credit / Balance">Credit (Pending)</option>
                        </select>
                      </div>
                      <div className="form-group-col">
                        <label>Paid Amount Today (₹)</label>
                        <input type="number" min="0" className="form-ctrl" value={billingPaidAmount} onChange={(e) => setBillingPaidAmount(e.target.value)} />
                      </div>
                    </div>
                  </div>
                  <div className="modal-foot-actions">
                    <button type="button" className="btn-action" onClick={() => setBillingModalOpen(false)}>Cancel</button>
                    <button type="submit" className="btn-action btn-action-primary">Create & Save Bill</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Shop Modal */}
          {newShopModalOpen && (
            <div className="modal-overlay-backdrop" onClick={() => setNewShopModalOpen(false)}>
              <div className="modal-window-card" onClick={(e) => e.stopPropagation()}>
                <div className="modal-head-row">
                  <h2 style={{ fontSize: '1.15rem', fontWeight: 700 }}>Add New Retail Shop</h2>
                  <button className="btn-action" onClick={() => setNewShopModalOpen(false)}>✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const shopData = {
                    id: 'shp-' + Date.now(),
                    name: form.name.value,
                    owner: form.owner.value,
                    area: form.area.value,
                    phone: form.phone.value,
                    balance: Number(form.balance.value || 0)
                  };
                  setShops([...shops, shopData]);
                  alert(`Shop ${shopData.name} registered!`);
                  setNewShopModalOpen(false);
                }}>
                  <div className="modal-body-content">
                    <div className="form-grid-2">
                      <div className="form-group-col span-2">
                        <label>Shop Name *</label>
                        <input type="text" name="name" required className="form-ctrl" placeholder="e.g. Royal Bakery & Sweets" />
                      </div>
                      <div className="form-group-col">
                        <label>Owner Name</label>
                        <input type="text" name="owner" className="form-ctrl" placeholder="e.g. K. Sundaram" />
                      </div>
                      <div className="form-group-col">
                        <label>Area / Route</label>
                        <input type="text" name="area" className="form-ctrl" placeholder="e.g. Vadapalani, Chennai" />
                      </div>
                      <div className="form-group-col">
                        <label>Phone Number</label>
                        <input type="text" name="phone" className="form-ctrl" placeholder="+91 98400 00000" />
                      </div>
                      <div className="form-group-col">
                        <label>Opening Balance (₹)</label>
                        <input type="number" name="balance" defaultValue="0" className="form-ctrl" />
                      </div>
                    </div>
                  </div>
                  <div className="modal-foot-actions">
                    <button type="button" className="btn-action" onClick={() => setNewShopModalOpen(false)}>Cancel</button>
                    <button type="submit" className="btn-action btn-action-primary">Save Shop</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Product Modal */}
          {newProductModalOpen && (
            <div className="modal-overlay-backdrop" onClick={() => setNewProductModalOpen(false)}>
              <div className="modal-window-card" onClick={(e) => e.stopPropagation()}>
                <div className="modal-head-row">
                  <h2 style={{ fontSize: '1.15rem', fontWeight: 700 }}>Add New Product Item</h2>
                  <button className="btn-action" onClick={() => setNewProductModalOpen(false)}>✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const prodData = {
                    id: 'prd-' + Date.now(),
                    name: form.name.value,
                    category: form.category.value,
                    price: Number(form.price.value),
                    cost: Number(form.cost.value),
                    stock: Number(form.stock.value)
                  };
                  setProducts([...products, prodData]);
                  alert(`Product ${prodData.name} registered!`);
                  setNewProductModalOpen(false);
                }}>
                  <div className="modal-body-content">
                    <div className="form-grid-2">
                      <div className="form-group-col span-2">
                        <label>Product Name *</label>
                        <input type="text" name="name" required className="form-ctrl" placeholder="e.g. Masala Cashews (100g)" />
                      </div>
                      <div className="form-group-col">
                        <label>Category</label>
                        <select name="category" className="form-ctrl">
                          <option value="Snacks">Snacks</option>
                          <option value="Chips">Chips</option>
                          <option value="Mixture">Mixture</option>
                          <option value="Murukku">Murukku</option>
                          <option value="Sweets">Sweets</option>
                        </select>
                      </div>
                      <div className="form-group-col">
                        <label>Selling Price (₹)</label>
                        <input type="number" name="price" defaultValue="50" className="form-ctrl" />
                      </div>
                      <div className="form-group-col">
                        <label>Purchase Cost (₹)</label>
                        <input type="number" name="cost" defaultValue="35" className="form-ctrl" />
                      </div>
                      <div className="form-group-col">
                        <label>Initial Stock (Pkts)</label>
                        <input type="number" name="stock" defaultValue="100" className="form-ctrl" />
                      </div>
                    </div>
                  </div>
                  <div className="modal-foot-actions">
                    <button type="button" className="btn-action" onClick={() => setNewProductModalOpen(false)}>Cancel</button>
                    <button type="submit" className="btn-action btn-action-primary">Save Product</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StacklyApp />);
  </script>
</body>
</html>
